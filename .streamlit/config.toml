# Server settings for running behind an AWS Application Load Balancer.
[server]
headless = true
port = 8501
address = "0.0.0.0"
# The ALB terminates TLS and forwards to the container over plain HTTP on the
# same origin, so Streamlit's CORS check has nothing useful to protect and only
# causes false rejections. XSRF protection stays ON.
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[client]
# Users must never see a Python traceback. The default is "full", which renders
# file paths, line numbers and library internals into the browser for anyone who
# triggers an error; a database misconfiguration exposed the Supabase hostname
# this way. "none" shows a generic message in the browser and keeps the full
# detail in the container logs, where it belongs.
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#C9A84C"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#1A1D27"
textColor = "#FFFFFF"
font = "sans serif"
