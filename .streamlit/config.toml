# Server settings for running behind Caddy on EC2.
[server]
headless = true
port = 8501
address = "0.0.0.0"

# CORS stays ON. With it disabled Streamlit sends Access-Control-Allow-Origin: *
# and, more seriously, accepts a WebSocket connection from any origin - and the
# WebSocket is the whole application, not a side channel. XSRF protection does
# not cover that, because opening a socket needs no token. This was set to false
# for an Application Load Balancer that no longer exists; Caddy proxies from the
# same origin, so there is nothing to relax.
enableCORS = true
corsAllowedOrigins = ["https://app.usetelosapp.com", "https://usetelosapp.com"]
enableXsrfProtection = true
maxUploadSize = 10

[client]
# Users must never see a Python traceback. The default is "full", which renders
# file paths, line numbers and library internals into the browser for anyone who
# triggers an error; a database misconfiguration exposed the Supabase hostname
# this way. "none" shows a generic message in the browser and keeps the full
# detail in the container logs, where it belongs.
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#C9A84C"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#1A1D27"
textColor = "#FFFFFF"
font = "sans serif"
