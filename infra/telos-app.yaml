AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Telos application — a single Graviton EC2 instance running Docker, with Caddy
  terminating TLS and proxying WebSockets.

  Why not ECS Fargate behind an ALB: that stack was built, measured, and costed
  at ~$36.70/month, of which the load balancer alone was $17.43 — 47% of the
  bill to balance a single container. This is ~$14.46/month for more RAM. The
  Fargate version is kept at infra/reference/telos-app-fargate.yaml along with
  the conditions that would justify going back to it.

  Why not App Runner: Streamlit runs its UI over a WebSocket and App Runner does
  not proxy WebSockets. Caddy does, natively.

  There is no SSH here. Access is via SSM Session Manager and deploys go through
  SSM Run Command, so no key pair exists and port 22 is never opened.

Parameters:
  DomainName:
    Type: String
    Default: usetelosapp.com
  AppSubdomain:
    Type: String
    Default: app
  HostedZoneId:
    Type: String
    Description: From the telos-dns stack output.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
    Description: >
      t4g.small is 2 vCPU / 2 GB on Graviton — more memory than the Fargate task
      it replaces, for less money. t4g.micro (1 GB) will OOM once pandas,
      pdfplumber and Pillow are all resident.
  VolumeSizeGb:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 100
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Resolved at deploy time — never a hardcoded AMI id.

Resources:

  # ----------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-igw' }]

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-rt' }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public web traffic only. No SSH; access is via SSM Session Manager.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for the HTTPS redirect and ACME challenges
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to Supabase, Anthropic, SSM, ACME and package repos
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-sg' }]

  # -------------------------------------------------------------- deploy bucket
  DeployBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'telos-deploy-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBundles
            Status: Enabled
            NoncurrentVersionExpirationInDays: 7
      VersioningConfiguration:
        Status: Enabled

  # -------------------------------------------------------------------- IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Gives Session Manager shell access and Run Command, without SSH.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: TelosRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/telos/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${DeployBucket.Arn}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # --------------------------------------------------------------- addressing
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-eip' }]

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  AppDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${AppSubdomain}.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords: [!Ref ElasticIp]

  # ---------------------------------------------------------------- instance
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGb
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'
        - Key: TelosRole
          Value: app
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/telos-bootstrap.log|logger -t telos -s 2>/dev/console) 2>&1

          dnf update -y
          dnf install -y docker unzip
          systemctl enable --now docker

          # Compose v2 as a docker plugin (arm64).
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -fsSL -o /usr/libexec/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose

          mkdir -p /opt/telos/app

          # Pull secrets from Parameter Store into an env file the container reads.
          cat > /opt/telos/refresh-env.sh <<'REFRESH'
          #!/bin/bash
          set -euo pipefail
          REGION="${AWS::Region}"
          OUT=/opt/telos/.env
          : > "$OUT.tmp"
          for KEY in ANTHROPIC_API_KEY DATABASE_URL SUPABASE_URL SUPABASE_ANON_KEY ADMIN_PASSWORD OWNER_EMAILS; do
            VALUE=$(aws ssm get-parameter --name "/telos/$KEY" --with-decryption \
                      --query 'Parameter.Value' --output text --region "$REGION" 2>/dev/null || echo "")
            printf '%s=%s\n' "$KEY" "$VALUE" >> "$OUT.tmp"
          done
          chmod 600 "$OUT.tmp"
          mv "$OUT.tmp" "$OUT"
          REFRESH
          chmod +x /opt/telos/refresh-env.sh

          # Pull the newest source bundle from S3 and (re)start the stack.
          cat > /opt/telos/deploy.sh <<'DEPLOY'
          #!/bin/bash
          set -euo pipefail
          BUCKET="${DeployBucket}"
          cd /opt/telos
          if aws s3 cp "s3://$BUCKET/app.zip" /tmp/app.zip --region "${AWS::Region}"; then
            rm -rf /opt/telos/app.new && mkdir -p /opt/telos/app.new
            unzip -q -o /tmp/app.zip -d /opt/telos/app.new
            rm -rf /opt/telos/app.old
            [ -d /opt/telos/app ] && mv /opt/telos/app /opt/telos/app.old || true
            mv /opt/telos/app.new /opt/telos/app
          fi
          /opt/telos/refresh-env.sh
          cd /opt/telos
          docker compose up -d --build
          docker image prune -f
          DEPLOY
          chmod +x /opt/telos/deploy.sh

          # Caddy: automatic Let's Encrypt certificates, and reverse_proxy
          # forwards the WebSocket Upgrade handshake without extra config.
          cat > /opt/telos/Caddyfile <<CADDY
          ${AppSubdomain}.${DomainName} {
              encode zstd gzip
              reverse_proxy telos:8501
          }
          CADDY

          cat > /opt/telos/docker-compose.yml <<'COMPOSE'
          services:
            telos:
              build: ./app
              restart: unless-stopped
              env_file: /opt/telos/.env
              expose: ["8501"]
              logging:
                driver: json-file
                options: { max-size: "10m", max-file: "3" }
            caddy:
              image: caddy:2-alpine
              restart: unless-stopped
              ports: ["80:80", "443:443"]
              volumes:
                - /opt/telos/Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config
              depends_on: [telos]
              logging:
                driver: json-file
                options: { max-size: "10m", max-file: "3" }
          volumes:
            caddy_data:
            caddy_config:
          COMPOSE

          # Bring the stack back up after a reboot.
          cat > /etc/systemd/system/telos.service <<'UNIT'
          [Unit]
          Description=Telos application stack
          Requires=docker.service
          After=docker.service network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/telos
          ExecStart=/opt/telos/refresh-env.sh
          ExecStartPost=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable telos.service

          # Supabase pauses Free-plan projects after 7 days of low activity, which
          # would leave a visitor staring at a database error. One trivial query a
          # day keeps the project marked active. Costs nothing.
          cat > /opt/telos/keepalive.sh <<'KEEP'
          #!/bin/bash
          cd /opt/telos
          docker compose exec -T telos python -c "\
          from core.database import get_connection
          conn = get_connection(); cur = conn.cursor()
          cur.execute('SELECT 1'); cur.close(); conn.close()
          print('supabase keepalive ok')" || echo "keepalive failed"
          KEEP
          chmod +x /opt/telos/keepalive.sh

          cat > /etc/systemd/system/telos-keepalive.service <<'KUNIT'
          [Unit]
          Description=Keep the Supabase project from pausing for inactivity
          [Service]
          Type=oneshot
          ExecStart=/opt/telos/keepalive.sh
          KUNIT

          cat > /etc/systemd/system/telos-keepalive.timer <<'KTIMER'
          [Unit]
          Description=Daily Supabase keepalive
          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=3600
          Persistent=true
          [Install]
          WantedBy=timers.target
          KTIMER
          systemctl daemon-reload
          systemctl enable --now telos-keepalive.timer

          # Unattended security patching.
          dnf install -y dnf-automatic
          sed -i 's/^apply_updates.*/apply_updates = yes/' /etc/dnf/automatic.conf
          systemctl enable --now dnf-automatic.timer

          echo "bootstrap complete — waiting for first deploy bundle"

Outputs:
  AppUrl:
    Description: Public URL for the app.
    Value: !Sub 'https://${AppSubdomain}.${DomainName}'
  PublicIp:
    Description: Elastic IP. Stable across stops, restarts and redeploys.
    Value: !Ref ElasticIp
  InstanceId:
    Description: Use with SSM Session Manager and Run Command.
    Value: !Ref Instance
  DeployBucketName:
    Value: !Ref DeployBucket
  SessionCommand:
    Description: Open a shell on the box without SSH.
    Value: !Sub 'aws ssm start-session --target ${Instance} --region ${AWS::Region}'
